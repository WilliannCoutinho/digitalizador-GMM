<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fólio">
<title>Fólio · Arquivo de GMMs</title>
<style>
:root{--bg:#f5f2ec;--ink:#1c1c1a;--mute:#7a766d;--line:#ddd8cc;--acc:#2f4a3a;--bad:#9b2c2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 40px);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.01em;margin:.2em 0}
h1{font-size:2.2rem}h2{font-size:1.4rem}
.mute{color:var(--mute);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
a{color:inherit}.back{color:var(--mute);text-decoration:none;font-size:.95rem}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;gap:10px}
.row b{font-family:Georgia,serif;font-weight:400;font-size:1.5rem}.row span{color:var(--mute)}
button,.btn{font:inherit;border:1px solid var(--ink);background:none;color:var(--ink);padding:11px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:6px 12px;font-size:.85rem}button.bad{color:var(--bad);border-color:var(--bad)}button:disabled{opacity:.4}
input[type=text],input[type=search],input:not([type]){font:inherit;width:100%;padding:13px 0;border:0;border-bottom:1px solid var(--ink);background:none;border-radius:0;outline:0;margin:6px 0 16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:16px 0}
.pg img{width:100%;border:1px solid var(--line);display:block;background:#fff}
.pg .c{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
.box{padding:14px;border:1px solid var(--bad);color:var(--bad);margin:10px 0;border-radius:6px}
.lb{position:fixed;inset:0;background:#000e;display:flex;flex-direction:column;z-index:9}
.lb .v{flex:1;overflow:auto;text-align:center}.lb img{width:100%;cursor:zoom-in}.lb img.z{width:250%;cursor:zoom-out}
.lb .bar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);color:#fff}
.lb .bar button{color:#fff;border-color:#fff;padding:8px 14px}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ================= Armazenamento (IndexedDB, neste aparelho) ================= */
const DB = new Promise((ok, no) => {
  const r = indexedDB.open('folio', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore('years', { keyPath: 'year' });
    d.createObjectStore('docs', { keyPath: 'id' });
    d.createObjectStore('pages', { keyPath: 'id' }).createIndex('doc', 'docId');
    d.createObjectStore('hist', { autoIncrement: true });
  };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const wrap = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const store = async (s, m = 'readonly') => (await DB).transaction(s, m).objectStore(s);
const getAll = async s => wrap((await store(s)).getAll());
const getOne = async (s, k) => wrap((await store(s)).get(k));
// gravação só termina quando a transação é confirmada (durabilidade)
async function write(ops) { // ops: [[store,'put'|'delete',value|key]]
  const d = await DB, names = [...new Set(ops.map(o => o[0]))], t = d.transaction(names, 'readwrite');
  ops.forEach(([s, op, v]) => t.objectStore(s)[op](v));
  return new Promise((ok, no) => { t.oncomplete = ok; t.onerror = t.onabort = () => no(t.error); });
}
const pagesOf = async (id, withDel) => { const s = await store('pages'); const a = await wrap(s.index('doc').getAll(id)); return a.filter(p => withDel || !p.del).sort((x, y) => x.pos - y.pos); };
const log = (op, docId, detail = '') => write([['hist', 'put', { op, docId, detail, ts: Date.now() }]]);
async function dupOf(year, rep, exceptId) { return (await getAll('docs')).find(d => d.year === year && d.rep === rep && !d.del && d.id !== exceptId); }

/* ================= Utilidades ================= */
const $ = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
const url = b => URL.createObjectURL(b);
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2800); }
function draw(h) { $.innerHTML = h; $.style.animation = 'none'; $.offsetWidth; $.style.animation = ''; }
const q = (s, f) => $.querySelectorAll(s).forEach(f);
const one = s => $.querySelector(s);
let scan = null;

/* ================= Imagem e OCR ================= */
async function processImage(file, rot = 0) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k0 = Math.min(1, 2600 / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k0), h = Math.round(bmp.height * k0);
  const c = document.createElement('canvas'), sw = rot % 180 !== 0; c.width = sw ? h : w; c.height = sw ? w : h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(bmp, -w / 2, -h / 2, w, h);
  const im = x.getImageData(0, 0, c.width, c.height), d = im.data, H = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 16) H[(d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11) | 0]++;
  const T = H.reduce((a, b) => a + b, 0); let lo = 0, hi = 255, a = 0;
  for (let i = 0; i < 256; i++) { a += H[i]; if (a > T * .01) { lo = i; break; } }
  a = 0; for (let i = 255; i >= 0; i--) { a += H[i]; if (a > T * .08) { hi = i; break; } }
  if (hi - lo > 40) { const k = 255 / (hi - lo); for (let i = 0; i < d.length; i += 4) for (let j = 0; j < 3; j++) d[i + j] = Math.max(0, Math.min(255, (d[i + j] - lo) * k)); x.putImageData(im, 0, 0); }
  return new Promise(r => c.toBlob(r, 'image/jpeg', .92));
}
let tess;
async function ocrRep(blob) {
  try {
    tess ||= new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    await tess;
    const t = (await Tesseract.recognize(blob, 'por')).data.text || '';
    const m = t.match(/R\.?E\.?P\.?\s*[:.\-nNºo°]*\s*(\d{2,8})/i) || t.match(/REP\D{0,6}(\d{2,8})/i);
    return m ? m[1] : '';
  } catch { return ''; }
}

/* ================= Rotas ================= */
window.addEventListener('hashchange', route);
function route() {
  const [, a, b, c] = location.hash.split('/');
  ({ a: () => yearView(+b), d: () => docView(b), s: () => scanView(+b, c), lixeira: trashView, historico: histView, backup: backupView }[a] || home)();
}

async function home() {
  const [ys, ds] = [await getAll('years'), (await getAll('docs')).filter(d => !d.del)];
  const n = {}; ds.forEach(d => n[d.year] = (n[d.year] || 0) + 1);
  const years = [...new Set([...ys.map(y => y.year), ...Object.keys(n).map(Number)])].sort((a, b) => b - a);
  draw(`<h1>Arquivo de GMMs</h1><p class="mute">${ds.length} documento${ds.length === 1 ? '' : 's'} arquivado${ds.length === 1 ? '' : 's'}</p>
  <div style="margin-top:24px">${years.map(y => `<a class="row" href="#/a/${y}"><b>${y}</b><span>${n[y] || 0} GMM${(n[y] || 0) === 1 ? '' : 's'}</span></a>`).join('') || '<p class="mute">Nenhuma pasta ainda. Crie a primeira.</p>'}</div>
  <div class="actions"><button id="ny">Nova pasta anual</button><a class="btn" href="#/lixeira">Lixeira</a><a class="btn" href="#/historico">Histórico</a><a class="btn" href="#/backup">Backup</a></div>`);
  one('#ny').onclick = async () => {
    const y = parseInt(prompt('Ano da nova pasta (ex.: 2027)'), 10); if (!y || y < 1990 || y > 2100) return;
    await write([['years', 'put', { year: y }]]); home();
  };
}

async function yearView(year) {
  const docs = (await getAll('docs')).filter(d => d.year === year && !d.del).sort((a, b) => a.rep.localeCompare(b.rep, 'pt', { numeric: true }));
  const pc = {}; (await getAll('pages')).forEach(p => { if (!p.del) pc[p.docId] = (pc[p.docId] || 0) + 1; });
  const list = t => docs.filter(d => d.rep.toLowerCase().includes(t.toLowerCase().trim())).map(d => `<a class="row" href="#/d/${d.id}"><b>REP ${esc(d.rep)}</b><span>${pc[d.id] || 0} pág.</span></a>`).join('') || '<p class="mute">Nenhuma GMM encontrada.</p>';
  draw(`<div class="top"><a class="back" href="#/">← Arquivo</a><button class="pri sm" id="ns">Digitalizar GMM</button></div><h1>${year}</h1><p class="mute">${docs.length} GMMs</p>
  <input type="search" id="q" inputmode="numeric" placeholder="Pesquisar REP"><div id="l">${list('')}</div>`);
  one('#ns').onclick = () => { scan = null; location.hash = `#/s/${year}`; };
  one('#q').oninput = e => one('#l').innerHTML = list(e.target.value);
}

let urls = [];
const revoke = () => { urls.forEach(URL.revokeObjectURL); urls = []; };
async function docView(id) {
  const d = await getOne('docs', id); if (!d) return (location.hash = '#/');
  const ps = await pagesOf(id); revoke(); ps.forEach(p => p._u = (urls.push(url(p.proc)), urls.at(-1)));
  draw(`<div class="top"><a class="back" href="#/a/${d.year}">← ${d.year}</a><span class="mute">${ps.length} página(s)</span></div><h1>REP ${esc(d.rep)}</h1>
  <div class="actions"><button class="sm" id="er">Editar REP</button><button class="sm" id="ap">Adicionar página</button><button class="sm" id="ea">Exportar todas</button><button class="sm bad" id="del">Excluir</button></div>
  <div class="grid">${ps.map((p, i) => `<div class="pg"><img data-i="${i}" src="${p._u}" alt="Página ${i + 1}"><div class="c">Pág. ${i + 1}
  <button class="sm" data-m="${i}" data-d="-1">↑</button><button class="sm" data-m="${i}" data-d="1">↓</button><button class="sm" data-x="${i}">Exportar</button><button class="sm" data-o="${i}">Original</button><button class="sm bad" data-r="${i}">Remover</button></div></div>`).join('')}</div>`);
  q('img[data-i]', im => im.onclick = () => lightbox(ps, +im.dataset.i, d));
  q('[data-m]', b => b.onclick = async () => {
    const i = +b.dataset.m, j = i + +b.dataset.d; if (j < 0 || j >= ps.length) return;
    [ps[i], ps[j]] = [ps[j], ps[i]]; ps.forEach((p, k) => p.pos = k + 1);
    await write(ps.map(p => ['pages', 'put', strip(p)])); await log('reordenar_paginas', id); docView(id);
  });
  q('[data-x]', b => b.onclick = () => exportFiles(d, [+b.dataset.x], ps, 'proc'));
  q('[data-o]', b => b.onclick = () => exportFiles(d, [+b.dataset.o], ps, 'orig'));
  q('[data-r]', b => b.onclick = async () => {
    if (!confirm('Remover esta página? A foto original continua guardada.')) return;
    const p = ps[+b.dataset.r]; p.del = Date.now(); await write([['pages', 'put', strip(p)]]); await log('remover_pagina', id, `pág. ${+b.dataset.r + 1}`); docView(id);
  });
  one('#ap').onclick = () => { scan = null; location.hash = `#/s/${d.year}/${id}`; };
  one('#ea').onclick = () => exportFiles(d, ps.map((_, i) => i), ps, 'proc');
  one('#er').onclick = async () => {
    const r = (prompt('Novo número da REP', d.rep) || '').trim(); if (!r || r === d.rep) return;
    if (await dupOf(d.year, r, id) && !confirm(`Já existe REP ${r} em ${d.year}. Alterar mesmo assim?`)) return;
    const old = d.rep; d.rep = r; await write([['docs', 'put', d]]); await log('alterar_rep', id, `${old} → ${r}`); docView(id);
  };
  one('#del').onclick = async () => {
    if (!confirm('Enviar esta GMM para a lixeira?')) return;
    d.del = Date.now(); await write([['docs', 'put', d]]); await log('excluir_documento', id, `REP ${d.rep}`); location.hash = `#/a/${d.year}`;
  };
}
const strip = p => { const { _u, ...r } = p; return r; };

async function exportFiles(d, idx, ps, key) {
  const files = idx.map(i => new File([ps[i][key]], `GMM_${d.year}_REP${d.rep}_p${String(i + 1).padStart(2, '0')}${key === 'orig' ? '_original' : ''}.jpg`, { type: 'image/jpeg' }));
  if (navigator.canShare?.({ files })) { try { await navigator.share({ files }); } catch {} return; }
  for (const f of files) { const a = document.createElement('a'); a.href = url(f); a.download = f.name; a.click(); await new Promise(r => setTimeout(r, 400)); }
}
function lightbox(ps, i, d) {
  const el = document.createElement('div'); el.className = 'lb';
  const wire = () => {
    el.innerHTML = `<div class="v"><img src="${ps[i]._u}"></div><div class="bar"><button id="pv">‹</button><span>${i + 1} / ${ps.length}</span><button id="nx">›</button><button id="sv">Exportar</button><button id="cl">Fechar</button></div>`;
    el.querySelector('img').onclick = e => e.target.classList.toggle('z');
    el.querySelector('#pv').onclick = () => { i = (i + ps.length - 1) % ps.length; wire(); };
    el.querySelector('#nx').onclick = () => { i = (i + 1) % ps.length; wire(); };
    el.querySelector('#sv').onclick = () => exportFiles(d, [i], ps, 'proc');
    el.querySelector('#cl').onclick = () => el.remove();
  };
  wire(); document.body.appendChild(el);
}

/* ================= Digitalização ================= */
async function scanView(year, existingId) {
  if (!scan) scan = { pages: [], rep: '', ocr: false };
  const s = scan;
  if (existingId && !s.rep) s.rep = (await getOne('docs', existingId))?.rep || '';
  const dup = async () => { const el = one('#dup'); if (!el) return; const d = s.rep && await dupOf(year, s.rep);
    el.innerHTML = d ? `<div class="box">Já existe a REP ${esc(s.rep)} em ${year}. <a href="#/d/${d.id}" target="_blank">Ver documento</a>. Você pode salvar mesmo assim.</div>` : ''; };
  const render = () => {
    draw(`<div class="top"><a class="back" href="${existingId ? '#/d/' + existingId : '#/a/' + year}">← Cancelar</a><span class="mute">Pasta ${year}</span></div>
    <h2>${existingId ? 'Adicionar páginas · REP ' + esc(s.rep) : 'Digitalizar GMM'}</h2>
    <div class="grid">${s.pages.map((p, i) => `<div class="pg"><img src="${p.u}"><div class="c">Pág. ${i + 1}<button class="sm" data-rot="${i}">Girar</button><button class="sm" data-rm="${i}">Tirar</button></div></div>`).join('')}</div>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden><input type="file" id="gal" accept="image/*" hidden>
    <div class="actions"><button class="pri" id="shot">${s.pages.length ? 'Fotografar outra página' : 'Abrir câmera'}</button><button id="pick">Escolher da galeria</button></div>
    ${s.pages.length && !existingId ? `<p class="mute">${s.ocr ? (s.rep ? 'REP lida automaticamente — confirme ou corrija:' : 'Não consegui ler a REP — digite:') : 'Lendo a REP…'}</p><input id="rep" inputmode="numeric" placeholder="Número da REP" value="${esc(s.rep)}"><div id="dup"></div>` : ''}
    ${s.pages.length ? '<button class="pri" id="save">Salvar GMM</button>' : ''}`);
    const add = async f => {
      if (!f) return; const proc = await processImage(f, 0);
      s.pages.push({ id: uid(), orig: f, proc, rot: 0, u: url(proc) }); render();
      if (!s.ocr && !existingId) { const r = await ocrRep(s.pages[0].proc); if (r && !s.rep) s.rep = r; s.ocr = true; render(); }
    };
    one('#cam').onchange = e => add(e.target.files[0]); one('#gal').onchange = e => add(e.target.files[0]);
    one('#shot').onclick = () => one('#cam').click(); one('#pick').onclick = () => one('#gal').click();
    q('[data-rm]', b => b.onclick = () => { s.pages.splice(+b.dataset.rm, 1); if (!s.pages.length) s.ocr = false; render(); });
    q('[data-rot]', b => b.onclick = async () => { const p = s.pages[+b.dataset.rot]; p.rot = (p.rot + 90) % 360; p.proc = await processImage(p.orig, p.rot); p.u = url(p.proc); render(); });
    const r = one('#rep'); if (r) { r.oninput = () => { s.rep = r.value.trim(); dup(); }; dup(); }
    const sv = one('#save'); if (sv) sv.onclick = () => save(sv, year, existingId);
  };
  render();
}
async function save(btn, year, existingId) {
  const s = scan;
  if (!existingId && !s.rep && !confirm('Salvar sem número de REP?')) return;
  const rep = s.rep || 'sem-REP', docId = existingId || s.docId || (s.docId = uid());
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    const have = existingId ? await pagesOf(docId, true) : [], base = have.reduce((m, p) => Math.max(m, p.pos), 0);
    const ops = [['years', 'put', { year }]];
    if (!existingId) ops.push(['docs', 'put', { id: docId, year, rep }]);
    s.pages.forEach((p, i) => ops.push(['pages', 'put', { id: p.id, docId, pos: base + i + 1, orig: p.orig, proc: p.proc }]));
    await write(ops); // só segue depois da transação confirmada
    const got = (await pagesOf(docId)).filter(p => s.pages.some(x => x.id === p.id)).length;
    if (got !== s.pages.length) throw new Error('confirmação');
    await log(existingId ? 'adicionar_paginas' : 'criar_gmm', docId, `REP ${rep} · ${s.pages.length} pág.`);
    scan = null; navigator.storage?.persist?.(); toast('GMM salva neste aparelho'); location.hash = `#/d/${docId}`;
  } catch { btn.disabled = false; btn.textContent = 'Tentar novamente'; toast('Não foi possível salvar. Verifique o espaço do aparelho.'); }
}

/* ================= Lixeira, histórico, backup ================= */
async function trashView() {
  const ds = (await getAll('docs')).filter(d => d.del).sort((a, b) => b.del - a.del);
  draw(`<div class="top"><a class="back" href="#/">← Arquivo</a></div><h1>Lixeira</h1>${ds.map(d => `<div class="row"><b>${d.year} · REP ${esc(d.rep)}</b><span><button class="sm" data-re="${d.id}">Restaurar</button> <button class="sm bad" data-pd="${d.id}">Apagar</button></span></div>`).join('') || '<p class="mute">Lixeira vazia.</p>'}`);
  q('[data-re]', b => b.onclick = async () => { const d = await getOne('docs', b.dataset.re); delete d.del; await write([['docs', 'put', d]]); await log('restaurar_documento', d.id, `REP ${d.rep}`); trashView(); });
  q('[data-pd]', b => b.onclick = async () => {
    if (!confirm('Apagar definitivamente? Não pode ser desfeito.') || !confirm('Confirma a exclusão permanente?')) return;
    const id = b.dataset.pd, ps = await pagesOf(id, true);
    await log('exclusao_permanente', id); await write([['docs', 'delete', id], ...ps.map(p => ['pages', 'delete', p.id])]); trashView();
  });
}
async function histView() {
  const h = (await getAll('hist')).reverse().slice(0, 300);
  draw(`<div class="top"><a class="back" href="#/">← Arquivo</a></div><h1>Histórico</h1>${h.map(x => `<div class="row"><span><b style="font-size:1rem;font-family:inherit">${esc(x.op.replace(/_/g, ' '))}</b><br>${esc(x.detail)}</span><span style="text-align:right">${new Date(x.ts).toLocaleString('pt-BR')}</span></div>`).join('') || '<p class="mute">Sem operações.</p>'}`);
}
const toData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function backupView() {
  const [ds, ps] = [await getAll('docs'), await getAll('pages')];
  const est = await navigator.storage?.estimate?.();
  draw(`<div class="top"><a class="back" href="#/">← Arquivo</a></div><h1>Backup</h1>
  <p>Os dados ficam <b>somente neste aparelho</b>. Faça backup com frequência e guarde o arquivo em outro lugar (iCloud, e-mail, computador).</p>
  <p class="mute">${ds.length} documentos · ${ps.length} páginas${est ? ' · ' + (est.usage / 1048576).toFixed(0) + ' MB usados' : ''}</p>
  <div class="actions"><button class="pri" id="ex">Exportar backup</button><button id="im">Importar backup</button></div><input type="file" id="f" accept=".json" hidden><p class="mute" id="st"></p>`);
  one('#ex').onclick = async () => {
    one('#st').textContent = 'Gerando backup…';
    const out = { v: 1, years: await getAll('years'), docs: ds, hist: await getAll('hist'), pages: [] };
    for (const p of ps) out.pages.push({ ...p, orig: await toData(p.orig), proc: await toData(p.proc) });
    const f = new File([JSON.stringify(out)], `folio-backup-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
    one('#st').textContent = 'Pronto.';
    if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f] }); return; } catch { return; } }
    const a = document.createElement('a'); a.href = url(f); a.download = f.name; a.click();
  };
  one('#im').onclick = () => one('#f').click();
  one('#f').onchange = async e => {
    try {
      const j = JSON.parse(await e.target.files[0].text()), ops = [];
      j.years.forEach(y => ops.push(['years', 'put', y])); j.docs.forEach(d => ops.push(['docs', 'put', d]));
      for (const p of j.pages) ops.push(['pages', 'put', { ...p, orig: await (await fetch(p.orig)).blob(), proc: await (await fetch(p.proc)).blob() }]);
      await write(ops); toast('Backup importado (registros existentes foram mantidos/atualizados)'); backupView();
    } catch { toast('Arquivo de backup inválido'); }
  };
}

route();
</script>
</body>
</html>
