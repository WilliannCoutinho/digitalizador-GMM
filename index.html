<html lang="pt-BR">

<title>Fólio · Arquivo de GMMs</title>
<style>
:root{--bg:#f4f1ea;--paper:#fbfaf6;--ink:#181816;--mute:#7b776d;--line:rgba(24,24,22,.12);--acc:#2c4a3b;--acc2:#e6ece7;--warn:#9a5b12;--bad:#9b2c2c;
--serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;--sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;--pad:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) var(--pad) calc(env(safe-area-inset-bottom) + 28px);min-height:100dvh;animation:in .28s ease both}
#app.dock-pad{padding-bottom:calc(env(safe-area-inset-bottom) + 112px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bar{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:8px}
.brand{font:600 .78rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.ib:hover,.ib:active{background:rgba(24,24,22,.07)}
.crumb{display:flex;align-items:center;gap:2px;margin-left:-8px;padding:8px 10px 8px 4px;border:0;background:none;color:var(--acc);cursor:pointer;font-size:.98rem;border-radius:999px}
.hero{padding:10px 0 22px}
.eyebrow{margin:0 0 6px;font:600 .72rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.title{margin:0;font:400 clamp(2.6rem,11vw,3.6rem)/1 var(--serif);letter-spacing:-.025em;word-break:break-word}
.title small{font:400 1rem var(--sans);letter-spacing:0;color:var(--mute);margin-left:8px}
.lede{margin:8px 0 0;color:var(--mute)}

.years{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.yr{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);transition:padding .15s}
.yr:active{background:rgba(24,24,22,.04)}
.yr .y{font:400 2rem/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;flex:1}
.yr .n{color:var(--mute);font-size:.92rem}.yr .n b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.search .i{color:var(--mute);width:18px}
.list{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mute);margin-top:3px;flex:none;display:grid;place-items:center;color:#fff}
.it .ck .i{width:14px;stroke-width:2.4;opacity:0}.it.on .ck{background:var(--acc);border-color:var(--acc)}.it.on .ck .i{opacity:1}
.it .main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.rep{font:400 1.35rem/1.15 var(--serif);letter-spacing:-.01em;font-variant-numeric:lining-nums}
.ver{border:0;background:none;padding:1px 0;color:var(--acc);font-size:.78rem;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;cursor:pointer}
.meta{color:var(--mute);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.pgs{color:var(--mute);font-size:.85rem;padding-top:6px;white-space:nowrap}
.dock{position:fixed;left:0;right:0;bottom:0;padding:18px var(--pad) calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(to top,var(--bg) 62%,rgba(244,241,234,0));display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.dock>*{pointer-events:auto}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 28px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:1rem;cursor:pointer;min-width:min(100%,280px);transition:transform .12s,opacity .15s;box-shadow:0 6px 20px rgba(44,74,59,.25)}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.4}
.btn{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.bad{color:var(--bad)}.btn:disabled{opacity:.4}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.empty{text-align:center;padding:36px 8px 10px}
.empty svg.art{width:150px;height:150px;margin-bottom:6px}
.empty h2{font:400 1.6rem var(--serif);margin:6px 0}.empty p{color:var(--mute);margin:0 auto 22px;max-width:30ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:10px 0}
.tile{position:relative}
.tile img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;background:#fff;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.tile .tc{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:.82rem;color:var(--mute)}
.tile .tc span{flex:1}.tile .tc button{border:0;background:none;padding:4px 7px;border-radius:8px;color:var(--mute);cursor:pointer}
.tile .tc button:hover{background:rgba(24,24,22,.07)}
.tile .mk{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);border:1.5px solid var(--mute);display:grid;place-items:center;color:#fff}
.tile .mk .i{width:15px;stroke-width:2.4;opacity:0}.tile.on .mk{background:var(--acc);border-color:var(--acc)}.tile.on .mk .i{opacity:1}
.field{margin:0 0 18px}
.field label{display:flex;justify-content:space-between;font:600 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.field input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:none;outline:0;padding:8px 0 9px;font:400 1.4rem var(--serif);border-radius:0}
.field input:focus{border-color:var(--acc)}.field.miss input{border-color:var(--warn)}
.field .hint{font-size:.8rem;color:var(--warn);margin-top:4px}.field .ok{color:var(--acc)}
.hint{font-size:.8rem;color:var(--warn);margin:-12px 0 16px}.hint.ok{color:var(--acc)}
.box{padding:12px 14px;border:1px solid var(--bad);color:var(--bad);border-radius:10px;font-size:.9rem;margin:8px 0}
.okbox{padding:12px 14px;border:1px solid var(--acc);background:var(--acc2);color:var(--acc);border-radius:10px;font-size:.92rem;margin:12px 0}
.note{font-size:.82rem;color:var(--warn);margin:8px 0 0}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:18px 0 12px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.capt{display:flex;flex-direction:column;gap:12px;margin:10px 0 24px}
.tips{color:var(--mute);font-size:.9rem;padding-left:18px;margin:0}
.spin{width:34px;height:34px;border:2.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
details{margin:6px 0 18px;color:var(--mute);font-size:.85rem}details pre{white-space:pre-wrap;background:rgba(24,24,22,.05);padding:10px;border-radius:8px;max-height:200px;overflow:auto}
.sheet-bg{position:fixed;inset:0;background:rgba(24,24,22,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet-bg.out{opacity:0;transition:opacity .18s}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 20px);animation:up .25s cubic-bezier(.2,.8,.2,1);max-height:88dvh;overflow:auto}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:400 1.5rem var(--serif);margin:0 0 4px}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.menu{list-style:none;margin:8px 0 0;padding:0}.menu button{width:100%;display:flex;align-items:center;gap:14px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:1.02rem}
.menu li:last-child button{border-bottom:0}.menu .i{color:var(--acc)}.menu em{margin-left:auto;font-style:normal;color:var(--mute);font-size:.85rem}.menu .bad,.menu .bad .i{color:var(--bad)}
.seg{display:flex;background:rgba(24,24,22,.07);border-radius:10px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-size:.92rem}.seg .on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.act{width:100%;display:flex;align-items:center;gap:14px;padding:13px 14px;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:none;text-align:left;cursor:pointer}
.act .i{color:var(--acc)}.act small{display:block;color:var(--mute);font-size:.8rem}.act:disabled{opacity:.4}
.lb{position:fixed;inset:0;background:#0c0c0bf2;z-index:40;display:flex;flex-direction:column;animation:fd .2s}
.lb .v{flex:1;overflow:auto;display:flex;touch-action:pan-x pan-y pinch-zoom}.lb img{margin:auto;max-width:100%;max-height:100%;cursor:zoom-in}.lb img.z{max-width:none;max-height:none;width:240%;cursor:zoom-out}
.lb .bar2{display:flex;align-items:center;justify-content:space-between;padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);color:#fff;gap:8px}
.lb .bar2 .ib{color:#fff}.lb .bar2 .ib:hover{background:rgba(255,255,255,.15)}.lb .top2{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 14px 0;color:#fff;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;z-index:60;font-size:.92rem;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){
 :root{--pad:40px}
 #app{max-width:980px}
 .years{display:grid;grid-template-columns:repeat(2,1fr);column-gap:48px}
 .grid{grid-template-columns:repeat(4,1fr)}
 .hero{padding:30px 0 34px}
 .list{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
 .sheet-bg{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}.sheet::before{display:none}
 .dock{position:static;background:none;padding:0;justify-content:flex-start;margin:20px 0}.cta{min-width:0}
 #app.dock-pad{padding-bottom:40px}#toast{bottom:30px}
}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>

<symbol id="i-archive" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="4" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"/></symbol>

</defs></svg>
<main id="app"></main>
<div id="toast" role="status"></div>
<script type="module">
/* ===== ui ===== */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ic = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
let tt;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); }
function sheet(html, mount) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  const close = () => { bg.classList.add('out'); setTimeout(() => bg.remove(), 180); };
  bg.onclick = e => { if (e.target === bg) close(); };
  document.body.appendChild(bg); mount && mount(bg.firstChild, close); return close;
}

/* ===== db ===== */
// Armazenamento local (IndexedDB). Mesmo banco "folio" v1 da versão anterior: dados antigos continuam intactos.
const DB = new Promise((ok, no) => {
  const r = indexedDB.open('folio', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore('years', { keyPath: 'year' });
    d.createObjectStore('docs', { keyPath: 'id' });
    d.createObjectStore('pages', { keyPath: 'id' }).createIndex('doc', 'docId');
    d.createObjectStore('hist', { autoIncrement: true });
  };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const wrap = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const store = async (s) => (await DB).transaction(s).objectStore(s);
const getAll = async s => wrap((await store(s)).getAll());
const getOne = async (s, k) => wrap((await store(s)).get(k));
// Só resolve quando a transação é confirmada pelo navegador.
async function write(ops) { // [[store,'put'|'delete',valor|chave]]
  const d = await DB, t = d.transaction([...new Set(ops.map(o => o[0]))], 'readwrite');
  ops.forEach(([s, op, v]) => t.objectStore(s)[op](v));
  return new Promise((ok, no) => { t.oncomplete = ok; t.onerror = t.onabort = () => no(t.error); });
}
async function pagesOf(id, withDeleted) {
  const a = await wrap((await store('pages')).index('doc').getAll(id));
  return a.filter(p => withDeleted || !p.del).sort((x, y) => x.pos - y.pos);
}
const log = (op, docId, detail = '') => write([['hist', 'put', { op, docId, detail, ts: Date.now() }]]);
// O REP é o identificador da GMM: não pode haver dois documentos com o mesmo REP na mesma pasta anual.
async function dupOf(year, rep, exceptId) {
  const k = String(rep).trim().toUpperCase();
  return (await getAll('docs')).find(d => d.year === year && !d.del && d.id !== exceptId && String(d.rep).toUpperCase() === k);
}
const byRep = (a, b) => String(a.rep).localeCompare(String(b.rep), 'pt', { numeric: true });

/* ===== parse ===== */
// Interpretação do texto do OCR: o REP (com prefixo e todos os dígitos) é o identificador da GMM.
// Só é preenchido quando o campo "REP" é lido com segurança; caso contrário o usuário digita (nada é inventado).
// Funções puras (testáveis em Node).
const DIG = { O: '0', o: '0', I: '1', l: '1', '|': '1' }; // só usado para sugerir leitura incerta
const toDigits = s => s.replace(/\s+/g, '').replace(/[OoIl|]/g, c => DIG[c]).replace(/\D/g, '');
const clean = s => s.replace(/[|_~]+/g, ' ').replace(/\s{2,}/g, ' ').replace(/^[\s:.\-–—]+|[\s:.\-–—]+$/g, '').trim();
// Normaliza o que o usuário digita: "123456" / "rep 123456" / "REP-123456" → "REP123456"
const normRep = v => { const t = String(v || '').toUpperCase().replace(/\s+/g, ''); const m = t.match(/^(?:REP)?[#:.\-N°º]*(\d+)$/); return m ? 'REP' + m[1] : t; };
const validRep = v => /^REP\d{3,}$/.test(v);

// Rótulos conhecidos (ajuste aqui se o seu formulário usar outros nomes).
const LABELS = {
  // "MATERIAL" sozinho só vale com ":" (evita o título "GUIA DE MOVIMENTAÇÃO DE MATERIAL")
  name: /^\W*(?:(?:NOMENCLATURA|DESCRI[ÇC][ÃA]O(?:\s+DO\s+MATERIAL)?|DENOMINA[ÇC][ÃA]O)\b\s*[:\-–]?|MATERIAL\s*[:\-–])\s*(.*)$/i,
};
const SEP = '(?:[ \\t.:\\-–#]|N[º°o]?\\.?)*(?:\\n[ \\t.:\\-–#]*)?';
// "REP" precisa ser uma palavra própria (não pode fazer parte de outra palavra). Grupo 1 = trecho do REP, grupo 2 = dígitos.
const REP_STRICT = new RegExp('(?:^|[^A-Za-z])(R\\s?[E3]\\s?P(?![A-Za-z])' + SEP + '(\\d{1,3}(?: \\d{3})+|\\d{3,12})(?![A-Za-z0-9]))', 'i');
const REP_LOOSE = new RegExp('(?:^|[^A-Za-z])(R\\s?[E3]\\s?P(?![A-Za-z])' + SEP + '([0-9OoIl|]{3,12})(?![A-Za-z0-9]))', 'i');

function findRep(t) {
  const seen = new Map();
  for (const m of t.matchAll(new RegExp(REP_STRICT.source, 'gi'))) { const dg = toDigits(m[2]); if (dg.length >= 3 && !seen.has(dg)) seen.set(dg, m[1]); }
  if (seen.size === 1) { const [dg, span] = [...seen][0]; return { rep: 'REP' + dg, span }; }
  if (seen.size > 1) return { rep: '', span: '', note: 'multi', cands: [...seen.keys()].map(d => 'REP' + d) };
  const lm = t.match(REP_LOOSE);
  if (lm) { const dg = toDigits(lm[2]); if (dg.length >= 3) return { rep: '', span: lm[1], note: 'unsure', cands: ['REP' + dg] }; }
  return { rep: '', span: '' };
}

function parseGmm(text) {
  const t = String(text || '').replace(/\r/g, '');
  const f = findRep(t), out = { rep: f.rep, name: '' };
  if (f.note) { out.note = f.note; out.cands = f.cands; }
  // remove o trecho do REP para não confundi-lo com o restante do texto
  const rest = f.span ? t.replace(f.span, ' ') : t;
  // Nomenclatura: texto após o rótulo; junta linhas seguintes quando a descrição é longa
  const lines = rest.split('\n').map(l => l.trim()).filter(l => l && !/GUIA/i.test(l));
  for (let i = 0; i < lines.length; i++) {
    const mm = lines[i].match(LABELS.name); if (!mm) continue;
    let val = clean(mm[1] || ''), j = i + 1;
    if (!val && lines[j]) { val = clean(lines[j]); j++; }
    for (let k = 0; k < 2 && lines[j]; k++, j++) {
      const nx = lines[j];
      if (/:/.test(nx) || LABELS.name.test(nx) || /^\W*[\d\W]+$/.test(nx) || nx.length < 4 || /REP|GMM/i.test(nx) || /^(QTD|QUANT|UN|UNID|UNIDADE|ITEM|COD|C[ÓO]D|VALOR|PESO|DATA|OBS|SETOR|ORIGEM|DESTINO)\b/i.test(nx)) break;
      val += ' ' + clean(nx);
    }
    if (val.length >= 3) { out.name = val.toUpperCase(); break; }
  }
  return out;
}

/* ===== imaging ===== */

// Monta o ZIP de uma pasta anual:  ANO/REP.../Foto.jpg  (páginas extras: Foto_2.jpg, Foto_3.jpg…)
// ver 'orig' = arquivo original da câmera (sem recompressão), exceto quando não é JPEG ou foi girado no app (usa a digitalizada).
async function buildYearZip({ year, docs, pagesFor, ver = 'orig', onProgress = () => { } }) {
  const root = String(year), entries = [{ name: root + '/', dir: true }], used = new Set(), stats = { gmms: 0, photos: 0, fallback: 0, renamed: [], empty: [] };
  const say = async p => { if (onProgress(p) === false) throw new Error('CANCELADO'); await tick(); };
  const list = docs.filter(d => d.year === year && !d.del);          // só este ano, nada da lixeira
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    await say({ stage: 'read', i: i + 1, n: list.length, rep: d.rep });
    const ps = (await pagesFor(d.id)).filter(p => p.docId === d.id && !p.del).sort((a, b) => a.pos - b.pos); // só fotos desta GMM
    if (!ps.length) { stats.empty.push(d.rep); continue; }

    while (used.has(dn.toLowerCase())) dn = `${base}_${++c}`;           // nunca mistura duas GMMs na mesma pasta
    used.add(dn.toLowerCase()); if (c > 1) stats.renamed.push(d.rep);
    entries.push({ name: `${root}/${dn}/`, dir: true });

      entries.push({ name: `${root}/${dn}/Foto${k ? '_' + (k + 1) : ''}.jpg`, blob, rep: d.rep }); stats.photos++;

  const got = await listZip(blob);
  const ok = got.length === entries.length && got.every((g, i) => g.name === entries[i].name && g.size === (entries[i].dir ? 0 : entries[i].blob.size));
  if (!ok) throw new Error('ESTRUTURA');

}

let workerP, onProg = null, tessP;

// Várias tentativas: cinza → limiar adaptativo → rotações (foto de lado/de cabeça para baixo).
async function ocrDocument(blob, status) {
  const tries = [['gray', 0], ['bin', 0], ['bin', 90], ['bin', 270], ['bin', 180]];
  let best = { fields: { rep: '', name: '' }, text: '', score: -1 }, hintF = null;
  try {
    const w = await worker();
    for (let i = 0; i < tries.length; i++) {
      onProg = m => m.status === 'recognizing text' && status(`Lendo documento (${i + 1}/${tries.length}) · ${Math.round(m.progress * 100)}%`);
      status(`Lendo documento (${i + 1}/${tries.length})`);
      const { data } = await w.recognize(await ocrVariant(blob, tries[i][1], tries[i][0]));
      const f = parseGmm(data.text), score = (f.rep ? 4 : 0) + (f.name ? 1 : 0);
      if (f.note && (!hintF || f.note === 'multi')) hintF = f;
      if (score > best.score) best = { fields: f, text: data.text, score };
      if (best.fields.rep && (i >= 1 || best.fields.name)) break;
    }
    if (!best.fields.rep && hintF) { best.fields.note = hintF.note; best.fields.cands = hintF.cands; }
  } catch (e) { best.error = e.message === 'offline' ? 'Sem internet para carregar o leitor (OCR). Digite os dados.' : 'Falha na leitura automática. Digite os dados.'; }
  return best;
}

/* ===== export ===== */
// Exportação robusta para iOS/Safari e desktop.
// <a download> fica no DOM e a URL vale 60 s (Safari ignora URL revogada na hora); share() é chamado direto no toque
// (arquivos já preparados antes), senão o iOS perde o "toque do usuário".

  document.body.appendChild(a); a.click();

}

  el.innerHTML = `<div class="top2"><span>Toque e segure a imagem → Salvar em Fotos</span><button class="ib" aria-label="Fechar">${ic('close')}</button></div><div class="v"><img src="${u}"></div><div class="bar2"></div>`;
  el.querySelector('button').onclick = () => { el.remove(); URL.revokeObjectURL(u); }; document.body.appendChild(el);

function exportDialog(title, getItems) {
  let ver = 'proc', items = null, zip = null, seq = 0;
  sheet('<div></div>', (el, close) => {
    const body = el.firstChild, n = () => items ? items.length : 0;
    const files = () => items.map(i => new File([i.blob], i.name, { type: i.blob.type || 'image/jpeg' }));
    const share = async fs => {
      if (!navigator.canShare || !navigator.canShare({ files: fs })) return toast('Compartilhamento indisponível aqui. Use Baixar ou ZIP.');
      try { await navigator.share({ files: fs, title }); } catch (e) { if (e.name !== 'AbortError') toast('Não foi possível compartilhar. Tente o ZIP ou Baixar.'); }
    };
    const draw = () => {
      const r = !!items, many = n() > 1;
      body.innerHTML = `<h3>Exportar</h3><p class="mute">${esc(title)} · ${r ? n() + ' arquivo' + (many ? 's' : '') + ' · ' + mb(items) + ' MB' : 'preparando…'}</p>
      <div class="seg"><button data-v="proc" class="${ver === 'proc' ? 'on' : ''}">Digitalizada</button><button data-v="orig" class="${ver === 'orig' ? 'on' : ''}">Original</button></div>
      <button class="act" data-a="share" ${r ? '' : 'disabled'}>${ic('share')}<span>Compartilhar${many ? ' fotos' : ''}<small>Fotos, Arquivos, WhatsApp, e-mail…</small></span></button>
      <button class="act" data-a="save" ${r ? '' : 'disabled'}>${ic('dl')}<span>Baixar${many ? ' arquivos' : ''}<small>${many ? 'Vários downloads seguidos' : 'Salvar o arquivo no aparelho'}</small></span></button>
      ${many ? `<button class="act" data-a="zshare" ${zip ? '' : 'disabled'}>${ic('archive')}<span>Compartilhar ZIP<small>${zip ? 'Um único arquivo com tudo' : 'montando…'}</small></span></button>
      <button class="act" data-a="zsave" ${zip ? '' : 'disabled'}>${ic('archive')}<span>Baixar ZIP</span></button>` : ''}
      ${n() === 1 ? `<button class="act" data-a="open">${ic('image')}<span>Abrir imagem<small>Segure a imagem para salvar em Fotos</small></span></button>` : ''}`;
    };
    const load = async () => {
      const my = ++seq; items = null; zip = null; draw();
      const got = dedupe(await getItems(ver)); if (my !== seq) return;

// Exportar pasta completa: um único ZIP com todas as GMMs do ano, sem abrir cada documento.
function exportYear(year) {
  let ver = 'orig', seq = 0, res = null;
  sheet('<div></div>', el => {
    const body = el.firstChild, alive = () => body.isConnected, zname = () => `${year}.zip`;
    const plr = n => `${n} ${plural(n, 'GMM', 'GMMs')}`;
    const bar = (pct, msg) => {

      body.querySelector('.prog i').style.width = pct + '%'; body.querySelector('#pm').textContent = msg;
    };
    const drawDone = () => {
      const s = res.stats, notes = [];
      if (ver === 'orig' && s.fallback) notes.push(`${s.fallback} ${plural(s.fallback, 'foto não estava em JPEG ou foi girada no app e foi exportada', 'fotos não estavam em JPEG ou foram giradas no app e foram exportadas')} na versão digitalizada.`);
      if (s.renamed.length) notes.push(`REP repetido em ${year} (${s.renamed.map(esc).join(', ')}): a segunda pasta recebeu o sufixo _2 para não misturar fotos.`);
      if (s.empty.length) notes.push(`Sem fotos, não exportado: ${s.empty.map(esc).join(', ')}.`);
      body.innerHTML = `<h3>ZIP pronto</h3><p class="mute">${zname()} · ${plr(s.gmms)} · ${s.photos} ${plural(s.photos, 'foto', 'fotos')} · ${(res.blob.size / 1048576).toFixed(1)} MB</p>
      <div class="okbox">Exportação concluída. Estrutura: <b>${year}/REP…/Foto.jpg</b></div>${notes.map(n => `<p class="note">${n}</p>`).join('')}
      <div class="seg"><button data-v="orig" class="${ver === 'orig' ? 'on' : ''}">Original</button><button data-v="proc" class="${ver === 'proc' ? 'on' : ''}">Digitalizada</button></div>
      <button class="act" data-a="share">${ic('share')}<span>Compartilhar ZIP<small>Arquivos, AirDrop, WhatsApp, e-mail…</small></span></button>
      <button class="act" data-a="save">${ic('dl')}<span>Baixar ZIP<small>Salvar o arquivo ${zname()} no aparelho</small></span></button>`;
    };
    const drawErr = e => {
      const m = e.message === 'ZIP_GRANDE' ? 'A pasta passa do limite de 4 GB de um único ZIP. Exporte por seleção de GMMs.'
        : e.message === 'ESTRUTURA' ? 'A conferência da estrutura do ZIP falhou. Nada foi entregue; tente novamente.'
        : 'Não foi possível ler as fotos ou montar o arquivo. Verifique o espaço e a memória do aparelho.';
      body.innerHTML = `<h3>Falha na exportação</h3><div class="box">${esc(m)}</div><button class="btn pri" data-a="retry">${ic('archive')}Tentar novamente</button>`;
    };
    const run = async () => {
      const my = ++seq; res = null; bar(0, 'Preparando…');
      try {
        const docs = (await getAll('docs')).filter(d => d.year === year && !d.del).sort(byRep);
        if (!docs.length) { body.innerHTML = `<h3>Exportar pasta completa</h3><p class="mute">Não existem documentos para exportar em ${year}.</p>`; return; }
        bar(0, `Processando ${plr(docs.length)}…`);
        const r = await buildYearZip({
          year, docs, ver, pagesFor: id => pagesOf(id),
          onProgress: p => {
            if (my !== seq || !alive()) return false;

            else bar(50 + Math.round(p.i / p.n * 50), `Montando o ZIP · ${p.i} de ${p.n} itens`);

    body.onclick = async e => {

      if (b.dataset.v) { if (b.dataset.v !== ver) { ver = b.dataset.v; run(); } return; }
      const a = b.dataset.a;
      if (a === 'retry') return run();
      if (!res) return;
      if (a === 'share') { // direto no toque: o ZIP já está pronto (exigência do iOS)
        const file = new File([res.blob], zname(), { type: 'application/zip' });

        try { await navigator.share({ files: [file], title: zname() }); toast('ZIP compartilhado.'); } catch (err) { if (err.name !== 'AbortError') toast('Não foi possível compartilhar. Use Baixar ZIP.'); }
      } else if (a === 'save') { saveBlob(res.blob, zname()); toast('Download do ZIP iniciado.'); }
    };
    run();

function draw(html, dock) { root.className = dock ? 'dock-pad' : ''; root.innerHTML = html; root.style.animation = 'none'; root.offsetWidth; root.style.animation = ''; window.scrollTo(0, 0); }
const dockBtn = (id, icon, label) => `<div class="dock"><button class="cta" id="${id}">${ic(icon)}${label}</button></div>`;
const strip = p => { const { _u, ...r } = p; return r; };

/* ---------- rotas ---------- */
const routes = { a: y => yearView(+y), d: docView, s: (y, id) => scanView(+y, id), lixeira: trashView, historico: histView, backup: backupView };
function route() { const [, a, b, c] = location.hash.split('/'); revokeAll(); selMode = false; sel = new Set(); (routes[a] || home)(b, c); }
addEventListener('hashchange', route);

/* ---------- início ---------- */
async function home() {
  const [ys, all] = [await getAll('years'), await getAll('docs')], docs = all.filter(d => !d.del), trash = all.length - docs.length;
  const n = {}; docs.forEach(d => n[d.year] = (n[d.year] || 0) + 1);
  const years = [...new Set([...ys.map(y => y.year), ...Object.keys(n).map(Number)])].sort((a, b) => b - a);
  draw(`<header class="bar"><span class="brand">Fólio</span><button class="ib" id="mn" aria-label="Mais opções">${ic('more')}</button></header>
  <section class="hero"><p class="eyebrow">Arquivo de GMMs</p><h1 class="title">${docs.length}<small>${plural(docs.length, 'documento arquivado', 'documentos arquivados')}</small></h1><p class="lede">${years.length} ${plural(years.length, 'pasta anual', 'pastas anuais')}</p></section>
  ${years.length ? `<ul class="years">${years.map(y => `<li><a class="yr" href="#/a/${y}"><span class="y">${y}</span><span class="n"><b>${n[y] || 0}</b> ${plural(n[y] || 0, 'GMM', 'GMMs')}</span>${ic('chev')}</a></li>`).join('')}</ul>`
    : emptyArt('Nenhuma pasta ainda', 'Crie a pasta do primeiro ano para começar a arquivar suas GMMs.', 'newyear', 'Criar pasta anual')}`);
  $('#mn').onclick = () => sheet(`<h3>Arquivo</h3><ul class="menu">
    <li><button data-m="ny">${ic('folder')}Nova pasta anual</button></li>
    <li><button data-m="lx">${ic('trash')}Lixeira<em>${trash || ''}</em></button></li>
    <li><button data-m="hi">${ic('clock')}Histórico</button></li>
    <li><button data-m="bk">${ic('archive')}Backup</button></li></ul>`, (el, close) => el.onclick = e => {
    const m = e.target.closest('button')?.dataset.m; if (!m) return; close();
    ({ ny: newYear, lx: () => location.hash = '#/lixeira', hi: () => location.hash = '#/historico', bk: () => location.hash = '#/backup' })[m]();
  });
  $('#newyear')?.addEventListener('click', newYear);
}
function newYear() {
  sheet(`<h3>Nova pasta anual</h3><p class="mute">Informe o ano da pasta.</p><div class="field" style="margin-top:14px"><input id="ny" inputmode="numeric" maxlength="4" value="${new Date().getFullYear()}"></div><button class="cta" id="ok" style="width:100%">Criar pasta</button>`, (el, close) => {
    el.querySelector('#ok').onclick = async () => {
      const y = parseInt(el.querySelector('#ny').value, 10); if (!y || y < 1990 || y > 2100) return toast('Ano inválido');
      await write([['years', 'put', { year: y }]]); close(); location.hash = `#/a/${y}`; route();
    };
  });
}
function emptyArt(title, text, id, label) {
  return `<div class="empty"><svg class="art" viewBox="0 0 150 150" fill="none" stroke="#7b776d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="38" y="24" width="74" height="98" rx="6" stroke-dasharray="4 5"/><path d="M52 52h46M52 66h46M52 80h28" opacity=".5"/><circle cx="108" cy="108" r="20" fill="#e6ece7" stroke="#2c4a3b"/><path d="M108 99v18M99 108h18" stroke="#2c4a3b" stroke-width="2"/></svg>
  <h2>${esc(title)}</h2><p>${esc(text)}</p>${id ? `<button class="cta" id="${id}" style="margin:0 auto">${ic('plus')}${esc(label)}</button>` : ''}</div>`;
}

/* ---------- pasta anual ---------- */
async function yearView(year) {
  const docs = (await getAll('docs')).filter(d => d.year === year && !d.del).sort(byRep);
  const pc = {}; (await getAll('pages')).forEach(p => { if (!p.del) pc[p.docId] = (pc[p.docId] || 0) + 1; });
  const startScan = () => { scan = null; location.hash = `#/s/${year}`; };
  const item = d => `<li class="it ${sel.has(d.id) ? 'on' : ''}" data-id="${d.id}">${selMode ? `<span class="ck">${ic('check')}</span>` : ''}
    <div class="main"><a class="rep" href="#/d/${d.id}">${esc(d.rep)}</a><button class="ver" data-v="${d.id}">ver foto</button>
    ${d.nome ? `<span class="meta">${esc(d.nome)}</span>` : ''}</div>
    <span class="pgs">${pc[d.id] || 0} pág.</span></li>`;
  const filtered = t => { const k = t.trim().toLowerCase(); return docs.filter(d => !k || [d.rep, d.nome].some(v => String(v || '').toLowerCase().includes(k))); };
  const paint = t => {
    const f = filtered(t); $('#l').innerHTML = f.map(item).join('') || `<li class="mute" style="padding:18px 0;list-style:none">Nenhuma GMM encontrada para “${esc(t)}”.</li>`;
    $$('#l .it', li => li.onclick = e => {
      const v = e.target.closest('[data-v]'); if (v) { e.preventDefault(); return openPhoto(v.dataset.v); }
      if (!selMode) return; e.preventDefault(); const id = li.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); li.classList.toggle('on'); upd();
    });
  };
  const upd = () => { const b = $('#cta'); if (b) { b.disabled = selMode && !sel.size; b.innerHTML = selMode ? `${ic('share')}Exportar ${sel.size ? '(' + sel.size + ')' : ''}` : `${ic('cam')}Digitalizar GMM`; } };
  const xall = `<button class="act" id="xall" style="margin:0 0 14px" ${docs.length ? '' : 'disabled'}>${ic('archive')}<span>Exportar pasta completa<small>${docs.length ? `Um ZIP com ${docs.length} ${plural(docs.length, 'GMM', 'GMMs')}: ${year}/REP…/Foto.jpg` : 'Não existem documentos para exportar'}</small></span></button>`;
  draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}Arquivo</button><button class="ib" id="mn" aria-label="Mais opções">${ic('more')}</button></header>
  <section class="hero"><p class="eyebrow">Pasta anual</p><h1 class="title">${year}</h1><p class="lede">${docs.length} ${plural(docs.length, 'GMM arquivada', 'GMMs arquivadas')}</p></section>
  ${xall}
  ${docs.length ? `<label class="search">${ic('search')}<input id="q" type="search" inputmode="search" placeholder="Pesquisar REP ou nomenclatura" autocomplete="off"></label><ul class="list" id="l"></ul>`
    : emptyArt(`Nenhuma GMM em ${year}`, 'Fotografe a primeira guia: o Fólio lê o REP e a nomenclatura.', 'first', 'Digitalizar a primeira GMM')}`, docs.length > 0);
  if (docs.length) { root.insertAdjacentHTML('beforeend', dockBtn('cta', 'cam', 'Digitalizar GMM')); paint(''); $('#q').oninput = e => paint(e.target.value); }
  $('#first')?.addEventListener('click', startScan);
  $('#xall').onclick = () => { if (!docs.length) return toast('Não existem documentos para exportar.'); exportYear(year); };
  $('#bk').onclick = () => location.hash = '#/';
  $('#mn').onclick = () => sheet(`<h3>${year}</h3><ul class="menu"><li><button data-m="xall">${ic('archive')}Exportar pasta completa</button></li>
    <li><button data-m="sel">${ic('sel')}${selMode ? 'Cancelar seleção' : 'Selecionar GMMs'}</button></li>
    <li><button data-m="scan">${ic('cam')}Digitalizar GMM</button></li></ul>`, (el, close) => el.onclick = e => {
    const m = e.target.closest('button')?.dataset.m; if (!m) return; close();
    if (m === 'scan') return startScan();
    if (!docs.length) return toast('Não existem documentos para exportar.');
    if (m === 'xall') return exportYear(year);
    selMode = !selMode; sel = new Set(); paint($('#q').value); upd();
  });
  const cta = $('#cta'); if (cta) cta.onclick = () => {
    if (!selMode) return startScan();
    const ids = [...sel]; exportDialog(`${year}_${ids.length}_GMMs`, async ver => {
      const out = []; for (const id of ids) { const d = docs.find(x => x.id === id); (await pagesOf(id)).forEach((p, i) => out.push({ name: pageName(d, p, i, ver), blob: ver === 'orig' ? p.orig : p.proc })); } return out;
    });
  };
}

/* ---------- visualizador de fotos ---------- */
async function openPhoto(id) { const d = await getOne('docs', id), ps = await pagesOf(id); if (!ps.length) return toast('Esta GMM não tem páginas.'); ps.forEach(p => p._u = mkUrl(p.proc)); viewer(d, ps, 0); }
function viewer(d, ps, i) {
  const el = document.createElement('div'); el.className = 'lb';
  const wire = () => {
    el.innerHTML = `<div class="top2"><span>${esc(d.rep)} · ${i + 1}/${ps.length}</span><button class="ib" id="cl" aria-label="Fechar">${ic('close')}</button></div><div class="v"><img src="${ps[i]._u}" alt="Página ${i + 1}"></div>
    <div class="bar2"><button class="ib" id="pv" aria-label="Anterior">${ic('back')}</button><button class="btn" id="ex">${ic('share')}Exportar</button><button class="ib" id="nx" aria-label="Próxima">${ic('chev')}</button></div>`;
    el.querySelector('img').onclick = e => e.target.classList.toggle('z');
    el.querySelector('#pv').onclick = () => { i = (i + ps.length - 1) % ps.length; wire(); };
    el.querySelector('#nx').onclick = () => { i = (i + 1) % ps.length; wire(); };
    el.querySelector('#cl').onclick = () => el.remove();
    el.querySelector('#ex').onclick = () => exportDialog(`${d.rep}_p${i + 1}`, async ver => [{ name: pageName(d, ps[i], i, ver), blob: ver === 'orig' ? ps[i].orig : ps[i].proc }]);
  };
  wire(); document.body.appendChild(el);
}

/* ---------- documento ---------- */
async function docView(id) {
  const d = await getOne('docs', id); if (!d) return (location.hash = '#/');
  const ps = await pagesOf(id); ps.forEach(p => p._u = mkUrl(p.proc));
  const tiles = () => ps.map((p, i) => `<div class="tile ${sel.has(p.id) ? 'on' : ''}" data-i="${i}">${selMode ? `<span class="mk">${ic('check')}</span>` : ''}<img src="${p._u}" alt="Página ${i + 1}">
    <div class="tc"><span>Pág. ${i + 1}</span><button data-m="${i}" data-d="-1" aria-label="Subir">↑</button><button data-m="${i}" data-d="1" aria-label="Descer">↓</button><button data-r="${i}" aria-label="Remover">${ic('close')}</button></div></div>`).join('');
  const paint = () => {
    $('#g').innerHTML = tiles();
    $$('#g .tile img', im => im.onclick = () => { const i = +im.closest('.tile').dataset.i; if (selMode) { const k = ps[i].id; sel.has(k) ? sel.delete(k) : sel.add(k); paint(); upd(); } else viewer(d, ps, i); });
    $$('#g [data-m]', b => b.onclick = async () => {
      const i = +b.dataset.m, j = i + +b.dataset.d; if (j < 0 || j >= ps.length) return;
      [ps[i], ps[j]] = [ps[j], ps[i]]; ps.forEach((p, k) => p.pos = k + 1);
      await write(ps.map(p => ['pages', 'put', strip(p)])); await log('reordenar_paginas', id); paint();
    });
    $$('#g [data-r]', b => b.onclick = async () => {
      if (!confirm('Remover esta página da GMM? A foto continua guardada no aparelho.')) return;
      const k = +b.dataset.r, p = ps[k]; p.del = Date.now(); await write([['pages', 'put', strip(p)]]); await log('remover_pagina', id, `pág. ${k + 1}`); docView(id);
    });
  };
  const upd = () => { const b = $('#cta'); b.disabled = selMode && !sel.size; b.innerHTML = selMode ? `${ic('share')}Exportar ${sel.size ? '(' + sel.size + ')' : ''}` : `${ic('plus')}Adicionar página`; };
  draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}${d.year}</button><button class="ib" id="mn" aria-label="Mais opções">${ic('more')}</button></header>
  <section class="hero"><p class="eyebrow">GMM · ${ps.length} ${plural(ps.length, 'página', 'páginas')}</p><h1 class="title" style="font-size:clamp(2rem,9vw,2.8rem)">${esc(d.rep)}</h1>
  ${d.nome ? `<p class="lede" style="color:var(--ink)">${esc(d.nome)}</p>` : ''}</section><div class="grid" id="g"></div>${dockBtn('cta', 'plus', 'Adicionar página')}`, true);
  paint(); $('#bk').onclick = () => location.hash = `#/a/${d.year}`;
  $('#cta').onclick = () => {
    if (!selMode) { scan = null; return (location.hash = `#/s/${d.year}/${id}`); }
    exportDialog(`${d.rep}_selecao`, async ver => ps.map((p, i) => ({ p, i })).filter(x => sel.has(x.p.id)).map(({ p, i }) => ({ name: pageName(d, p, i, ver), blob: ver === 'orig' ? p.orig : p.proc })));
  };
  $('#mn').onclick = () => sheet(`<h3>${esc(d.rep)}</h3><ul class="menu">
    <li><button data-m="all">${ic('share')}Exportar todas as páginas</button></li><li><button data-m="sel">${ic('sel')}${selMode ? 'Cancelar seleção' : 'Selecionar páginas'}</button></li>
    <li><button data-m="ed">${ic('edit')}Editar dados</button></li><li><button class="bad" data-m="del">${ic('trash')}Enviar para a lixeira</button></li></ul>`, (el, close) => el.onclick = async e => {
    const m = e.target.closest('button')?.dataset.m; if (!m) return; close();
    if (m === 'all') exportDialog(`${d.rep}`, async ver => ps.map((p, i) => ({ name: pageName(d, p, i, ver), blob: ver === 'orig' ? p.orig : p.proc })));
    if (m === 'sel') { selMode = !selMode; sel = new Set(); paint(); upd(); }
    if (m === 'ed') editDoc(d);
    if (m === 'del') { if (!confirm('Enviar esta GMM para a lixeira?')) return; d.del = Date.now(); await write([['docs', 'put', d]]); await log('excluir_documento', id, `REP ${d.rep}`); location.hash = `#/a/${d.year}`; }
  });
}
function editDoc(d) {
  sheet(`<h3>Editar dados</h3>${field('rep', 'REP', d.rep)}${field('nome', 'Nomenclatura', d.nome)}<div id="dup"></div><button class="cta" id="ok" style="width:100%">Salvar</button>`, (el, close) => {
    const v = k => el.querySelector('#f-' + k).value.trim();
    el.querySelector('#f-rep').onblur = e => { e.target.value = normRep(e.target.value); };
    el.querySelector('#ok').onclick = async () => {
      const rep = normRep(v('rep')); if (!validRep(rep)) return toast('Informe o REP completo (ex.: REP000123).');
      if (rep !== String(d.rep).toUpperCase() && await dupOf(d.year, rep, d.id)) return toast(`Já existe ${rep} em ${d.year}. O REP identifica a GMM e não pode se repetir.`);
      const old = `${d.rep} | ${d.nome || ''}`; Object.assign(d, { rep, nome: v('nome').toUpperCase() });
      await write([['docs', 'put', d]]); await log('alterar_dados', d.id, `${old} → ${d.rep} | ${d.nome}`); close(); docView(d.id);
    };
  });
}
const field = (k, label, val, extra = '') => `<div class="field ${extra}"><label>${label}</label><input id="f-${k}" value="${esc(val || '')}" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>`;

/* ---------- digitalização ---------- */
async function scanView(year, existingId) {
  if (!scan || scan.year !== year || scan.existingId !== existingId) scan = { year, existingId, pages: [], f: { rep: '', name: '' }, read: {}, repNote: null, text: '', stage: 'capture', note: '' };
  const s = scan, ex = existingId ? await getOne('docs', existingId) : null;
  const back = existingId ? `#/d/${existingId}` : `#/a/${year}`;
  const input = `<input type="file" id="cam" accept="image/*" capture="environment" hidden><input type="file" id="gal" accept="image/*" hidden>`;
  const wireInputs = () => {
    const go = e => { const f = e.target.files[0]; e.target.value = ''; add(f); };
    $('#cam').onchange = go; $('#gal').onchange = go; $('#shot')?.addEventListener('click', () => $('#cam').click()); $('#pick')?.addEventListener('click', () => $('#gal').click());
  };
  const add = async f => {
    if (!f) return; s.stage = 'busy'; s.note = 'Preparando imagem…'; render();
    try {
      const proc = await processImage(f, 0); s.pages.push({ id: uid(), orig: f, proc, rot: 0, u: mkUrl(proc) });
      if (!existingId && s.pages.length === 1) {
        s.stage = 'busy'; render(); const r = await ocrDocument(proc, t => { s.note = t; const n = $('#note'); if (n) n.textContent = t; });
        s.f = { rep: r.fields.rep, name: r.fields.name }; s.text = r.text; s.read = { rep: !!r.fields.rep, name: !!r.fields.name };
        s.repNote = r.fields.note ? { note: r.fields.note, cands: r.fields.cands } : null; s.err = r.error || '';
      }
    } catch { toast('Não consegui abrir esta imagem. Tente outra foto.'); }
    s.stage = s.pages.length ? 'review' : 'capture'; render();
  };
  const repHint = () => {
    if (existingId) return '';
    const n = s.repNote;
    if (s.f.rep) return s.read.rep ? `<div class="hint ok">Lido do documento — confira${s.f.rep.replace(/\D/g, '').length !== 6 ? ' · formato diferente de REP000000' : ''}</div>` : '';
    if (n?.note === 'multi') return `<div class="hint">Mais de um REP encontrado (${esc(n.cands.join(', '))}). Digite o correto.</div>`;
    if (n?.note === 'unsure') return `<div class="hint">Leitura incerta (${esc(n.cands.join(', '))}). Digite o REP correto.</div>`;
    return '<div class="hint">REP não identificado — digite (ex.: REP000123)</div>';
  };
  const nameHint = () => s.f.name ? (s.read.name ? '<div class="hint ok">Lido do documento — confira</div>' : '') : '<div class="hint">Nomenclatura não identificada — digite</div>';
  const render = () => {
    if (s.stage === 'busy') { draw(`<div class="empty" style="padding-top:25vh"><div class="spin"></div><h2>Lendo a GMM</h2><p id="note">${esc(s.note)}</p></div>`); return; }
    if (!s.pages.length) {
      draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}Cancelar</button><span class="brand">${year}</span></header>
      <section class="hero"><p class="eyebrow">${existingId ? 'Adicionar página · ' + esc(ex?.rep || '') : 'Nova GMM'}</p><h1 class="title" style="font-size:2.4rem">Digitalizar</h1></section>${input}
      <div class="capt"><button class="cta" id="shot" style="width:100%">${ic('cam')}Fotografar documento</button><button class="btn" id="pick" style="justify-content:center;height:50px">${ic('image')}Escolher da galeria</button></div>
      <ul class="tips"><li>Enquadre a folha inteira, sem cortar carimbos nem números.</li><li>Prefira luz uniforme e evite sombras sobre o texto.</li><li>Fotografe de frente, com a folha reta.</li></ul>`);
      $('#bk').onclick = () => location.hash = back; wireInputs(); return;
    }
    const miss = { rep: !s.f.rep, name: !s.f.name };
    draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}Cancelar</button><span class="brand">${year}</span></header>
    <section class="hero"><p class="eyebrow">${existingId ? 'Adicionar página · ' + esc(ex?.rep || '') : 'Conferência'}</p><h1 class="title" style="font-size:2.2rem">${existingId ? 'Novas páginas' : 'Confira os dados'}</h1></section>
    ${s.err ? `<div class="box">${esc(s.err)}</div>` : ''}
    <div class="grid">${s.pages.map((p, i) => `<div class="tile"><img src="${p.u}"><div class="tc"><span>Pág. ${i + 1}</span><button data-rot="${i}">Girar</button><button data-rm="${i}">Tirar</button></div></div>`).join('')}</div>${input}
    <div class="row-actions"><button class="btn" id="shot">${ic('cam')}Outra página</button><button class="btn" id="pick">${ic('image')}Galeria</button></div>
    ${existingId ? '' : `<div style="margin-top:20px">${field('rep', 'REP', s.f.rep, miss.rep ? 'miss' : '')}${repHint()}<div id="dup"></div>
    ${field('name', 'Nomenclatura', s.f.name, miss.name ? 'miss' : '')}${nameHint()}
    ${s.text ? `<details><summary>Texto lido pelo OCR</summary><pre>${esc(s.text)}</pre></details>` : ''}</div>`}
    ${dockBtn('save', 'check', existingId ? 'Salvar páginas' : 'Confirmar e salvar')}`, true);
    $('#bk').onclick = () => { if (!s.pages.length || confirm('Descartar esta digitalização?')) { scan = null; location.hash = back; } };
    wireInputs();
    $$('[data-rm]', b => b.onclick = () => { s.pages.splice(+b.dataset.rm, 1); if (!s.pages.length) { s.stage = 'capture'; s.f = { rep: '', name: '' }; s.repNote = null; s.text = ''; } render(); });
    $$('[data-rot]', b => b.onclick = async () => { const p = s.pages[+b.dataset.rot]; p.rot = (p.rot + 90) % 360; p.proc = await processImage(p.orig, p.rot); p.u = mkUrl(p.proc); render(); });
    if (!existingId) {
      // O REP identifica a GMM: se já existe na pasta, não deixa salvar de novo (a GMM seria duplicada).
      const dup = async () => {
        const r = normRep(s.f.rep), d = validRep(r) ? await dupOf(year, r) : null, b = $('#dup'), sv = $('#save'); if (!b) return;
        b.innerHTML = d ? `<div class="box">Já existe ${esc(r)} em ${year}. Esta GMM já está arquivada. <a href="#/d/${d.id}" target="_blank" style="text-decoration:underline">Ver documento</a> e use “Adicionar página” se for outra folha dela.</div>` : '';
        if (sv) sv.disabled = !!d;
      };
      const rep = $('#f-rep'), nm = $('#f-name');
      rep.oninput = () => { s.f.rep = rep.value.trim().toUpperCase(); dup(); };
      nm.oninput = () => { s.f.name = nm.value.trim().toUpperCase(); };
      rep.onblur = () => { const v = normRep(rep.value); rep.value = v; s.f.rep = v; dup(); };
      dup();
    }
    $('#save').onclick = () => save(existingId, ex);
  };
  async function save(existingId, ex) {
    const btn = $('#save'); let rep = '';
    if (!existingId) {
      rep = normRep(s.f.rep);
      if (!validRep(rep)) return toast('Informe o REP completo (ex.: REP000123).');
      if (await dupOf(year, rep, s.docId)) return toast(`Já existe ${rep} em ${year}. Abra o documento para adicionar páginas.`);
      if (!s.f.name && !confirm('A nomenclatura está vazia. Salvar mesmo assim?')) return;
    }
    btn.disabled = true; btn.innerHTML = 'Salvando…';
    try {
      const docId = existingId || s.docId || (s.docId = uid()), have = existingId ? await pagesOf(docId, true) : [], base = have.reduce((a, p) => Math.max(a, p.pos), 0);
      const ops = [['years', 'put', { year }]];
      if (!existingId) ops.push(['docs', 'put', { id: docId, year, rep, nome: s.f.name }]);
      s.pages.forEach((p, i) => ops.push(['pages', 'put', { id: p.id, docId, pos: base + i + 1, orig: p.orig, proc: p.proc, rot: p.rot }]));
      await write(ops);
      const got = (await pagesOf(docId)).filter(p => s.pages.some(x => x.id === p.id)).length; if (got !== s.pages.length) throw 0;
      await log(existingId ? 'adicionar_paginas' : 'criar_gmm', docId, `${existingId ? ex.rep : rep} · ${s.pages.length} pág.`);
      navigator.storage?.persist?.(); scan = null; toast('GMM salva'); location.hash = `#/d/${docId}`;
    } catch { btn.disabled = false; btn.innerHTML = 'Tentar novamente'; toast('Não foi possível salvar. Verifique o espaço do aparelho.'); }
  }
  s.stage = s.pages.length ? 'review' : 'capture'; render();
}

/* ---------- lixeira / histórico / backup ---------- */
async function trashView() {
  const ds = (await getAll('docs')).filter(d => d.del).sort((a, b) => b.del - a.del);
  draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}Arquivo</button></header><section class="hero"><p class="eyebrow">Recuperação</p><h1 class="title">Lixeira</h1></section>
  ${ds.length ? `<ul class="list">${ds.map(d => `<li class="it"><div class="main"><span class="rep">${esc(d.rep)}</span><span class="meta">${d.year}${d.nome ? ' · ' + esc(d.nome) : ''}</span></div><button class="btn" data-re="${d.id}">Restaurar</button><button class="btn bad" data-pd="${d.id}">Apagar</button></li>`).join('')}</ul>` : emptyArt('Lixeira vazia', 'GMMs excluídas aparecem aqui e podem ser restauradas.')}`);
  $('#bk').onclick = () => location.hash = '#/';
  $$('[data-re]', b => b.onclick = async () => {
    const d = await getOne('docs', b.dataset.re);
    if (await dupOf(d.year, d.rep, d.id)) return toast(`Já existe ${d.rep} em ${d.year}. Altere o REP do outro documento antes de restaurar.`);
    delete d.del; await write([['docs', 'put', d]]); await log('restaurar_documento', d.id, `REP ${d.rep}`); trashView();
  });
  $$('[data-pd]', b => b.onclick = async () => {
    if (!confirm('Apagar definitivamente? Não pode ser desfeito.') || !confirm('Confirma a exclusão permanente?')) return;
    const id = b.dataset.pd, ps = await pagesOf(id, true); await log('exclusao_permanente', id); await write([['docs', 'delete', id], ...ps.map(p => ['pages', 'delete', p.id])]); trashView();
  });
}
async function histView() {
  const h = (await getAll('hist')).reverse().slice(0, 300);
  draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}Arquivo</button></header><section class="hero"><p class="eyebrow">Registro</p><h1 class="title">Histórico</h1></section>
  ${h.length ? `<ul class="list">${h.map(x => `<li class="it"><div class="main"><span style="font-weight:600">${esc(x.op.replace(/_/g, ' '))}</span><span class="meta">${esc(x.detail)}</span></div><span class="pgs">${new Date(x.ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span></li>`).join('')}</ul>` : emptyArt('Sem operações', 'As ações realizadas no arquivo aparecem aqui.')}`);
  $('#bk').onclick = () => location.hash = '#/';
}
const toData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function backupView() {
  const [ds, ps] = [await getAll('docs'), await getAll('pages')], est = await navigator.storage?.estimate?.();
  draw(`<header class="bar"><button class="crumb" id="bk">${ic('back')}Arquivo</button></header><section class="hero"><p class="eyebrow">Segurança</p><h1 class="title">Backup</h1></section>
  <p>Os dados ficam <b>somente neste aparelho</b>. Exporte o backup com frequência e guarde o arquivo em outro lugar (iCloud, computador, e-mail).</p>
  <p class="mute">${ds.length} documentos · ${ps.length} páginas${est ? ' · ' + (est.usage / 1048576).toFixed(0) + ' MB usados' : ''}</p>
  <div class="row-actions"><button class="btn pri" id="ex">${ic('dl')}Exportar backup</button><button class="btn" id="im">${ic('plus')}Importar backup</button></div><input type="file" id="f" accept=".json" hidden><p class="mute" id="st"></p>`);
  $('#bk').onclick = () => location.hash = '#/';
  $('#ex').onclick = async () => {
    $('#st').textContent = 'Gerando backup…';
    const out = { v: 1, years: await getAll('years'), docs: ds, hist: await getAll('hist'), pages: [] };
    for (const p of ps) out.pages.push({ ...p, orig: await toData(p.orig), proc: await toData(p.proc) });
    const f = new File([JSON.stringify(out)], `folio-backup-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
    $('#st').innerHTML = '<button class="btn pri" id="go">Compartilhar / salvar backup</button>';
    $('#go').onclick = async () => { if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch {} } else { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 60000); } };
  };
  $('#im').onclick = () => $('#f').click();
  $('#f').onchange = async e => {
    try {
      const j = JSON.parse(await e.target.files[0].text()), ops = [];
      j.years.forEach(y => ops.push(['years', 'put', y])); j.docs.forEach(d => ops.push(['docs', 'put', d]));
      for (const p of j.pages) ops.push(['pages', 'put', { ...p, orig: await (await fetch(p.orig)).blob(), proc: await (await fetch(p.proc)).blob() }]);
      await write(ops); toast('Backup importado'); backupView();
    } catch { toast('Arquivo de backup inválido'); }
  };
}

route();
</script>
